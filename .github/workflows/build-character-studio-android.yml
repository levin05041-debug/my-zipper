name: Build Character Studio Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-character-studio/**'
      - '.github/workflows/build-character-studio-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build APK
        working-directory: android-character-studio
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: character-studio-debug-apk
          path: android-character-studio/bin/*.apk
          if-no-files-found: error
